# .cnb.yml —— 把 GitHub release 的 Windows exe 镜像到 CNB release(国内下载快)
#
# 为什么这样:CNB(Linux runner)无法构建 Windows exe;exe 由 GitHub Actions 构建。
# 这里在 tag 推送时,把同 tag 的 GitHub release exe 抓回来,用 cnbcool/attachments
# 挂到 CNB release,让国内用户 / oops self-update 能从 CNB 高速下载。
#
# 不在 CNB 重复 lint/test(GitHub .github/workflows/ci.yml 已覆盖)。CNB 只做这件独有事。
#
# ⚠️ 需在 CNB 首次运行后按平台实际行为微调(我无法从这里测 CNB 流水线):
#   - tag 的环境变量名 / release 是否随 tag 自动创建。
#   - 若报 "release 不存在",需在前面加 git:release 内置步骤建 release。
$:  
  tag_push:
    - stages:
        - name: fetch-exe-from-github
          image: alpine:latest
          script: |
            set -e
            apk add --no-cache curl git
            TAG="$(git describe --tags --exact-match HEAD 2>/dev/null)"
            [ -n "$TAG" ] || { echo "无法解析 tag(git describe 失败)"; exit 1; }
            echo "镜像 tag=$TAG 的 GitHub release exe"
            ASSET="oops-windows-x64_${TAG}.zip"
            # GitHub Actions 构建约需 1~2 分钟,带重试;GitHub 直链 + ghfast 代理兜底
            for U in \
              "https://github.com/idk500/OOPS/releases/download/${TAG}/${ASSET}" \
              "https://ghfast.top/https://github.com/idk500/OOPS/releases/download/${TAG}/${ASSET}" ; do
              echo "try: $U"
              if curl -fL --retry 8 --retry-delay 15 --retry-connrefused -o "${ASSET}" "$U" ; then
                break
              fi
            done
            test -s "${ASSET}" || { echo "下载失败(GitHub release 可能还没构建完或不可达)"; exit 1; }
            ls -la "${ASSET}"
            echo "ASSET=${ASSET}" > workspace.env
        - name: upload-to-cnb-release
          image: cnbcool/attachments:latest
          settings:
            tag: $CNB_GIT_TAG
            attachments:
              - "./oops-windows-x64_*.zip"
