# .cnb.yml —— 镜像 GitHub release 的 Windows exe 到 CNB release(国内下载快)
#
# CNB(Linux runner)无法构建 Windows exe;exe 由 GitHub Actions 构建。
# tag 推送时:从 GitHub release 抓同 tag 的 exe → 用 git:release 建 CNB release
# → 用 cnbcool/attachments 把 exe 挂上去。CNB 不重复 lint/test(GitHub ci.yml 已覆盖)。
#:
$:
  tag_push:
    - stages:
        - name: fetch-exe-from-github
          image: alpine:latest
          script: |
            set -e
            apk add --no-cache curl git
            TAG="$(git describe --tags --exact-match HEAD 2>/dev/null)"
            [ -n "$TAG" ] || { echo "无法解析 tag(git describe 失败)"; exit 1; }
            echo "镜像 tag=$TAG 的 GitHub release exe"
            ASSET="oops-windows-x64_${TAG}.zip"
            # GitHub 直链 + ghfast 代理兜底(带重试,GitHub Actions 构建约需 1~2 分钟)
            for U in \
              "https://github.com/idk500/OOPS/releases/download/${TAG}/${ASSET}" \
              "https://ghfast.top/https://github.com/idk500/OOPS/releases/download/${TAG}/${ASSET}" ; do
              echo "try: $U"
              if curl -fL --retry 8 --retry-delay 15 --retry-connrefused -o "${ASSET}" "$U" ; then
                break
              fi
            done
            test -s "${ASSET}" || { echo "下载失败(GitHub release 可能还没构建完或不可达)"; exit 1; }
            ls -la "${ASSET}"
        - name: create-cnb-release
          type: git:release
          options:
            description: "Windows exe 由 GitHub Actions 构建,本仓为国内下载镜像。完整说明: https://github.com/idk500/OOPS/releases"
        - name: upload-to-cnb-release
          image: cnbcool/attachments:latest
          settings:
            tag: $CNB_GIT_TAG
            attachments:
              - "./oops-windows-x64_*.zip"
