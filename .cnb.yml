# .cnb.yml —— CNB 原生构建 Windows exe 并发布到 CNB release
#
# 变更说明:
#   以前(≤ v0.6.0)在 tag 推送时,从 GitHub release 抓取 exe 镜像到 CNB(依赖 GitHub CI)。
#   现在改为 CNB 原生构建:用 Wine + Windows Python + PyInstaller 在 CNB Linux runner 上
#   直接构建 Windows exe,打包 zip 并上传到 CNB release,不再依赖 GitHub。
#
# 构建环境:build/win-build/Dockerfile(Wine + Windows Python 3.11 + PyInstaller)。
#   docker.build 会缓存该镜像;Dockerfile 或 requirements.txt 变更时自动重建。

$:
  tag_push:
    - name: build-windows-exe-and-release
      docker:
        build:
          dockerfile: build/win-build/Dockerfile
          by:
            - build/win-build/Dockerfile
            - requirements.txt
          versionBy:
            - build/win-build/Dockerfile
            - requirements.txt
      stages:
        - name: build-windows-exe
          script: |
            set -e
            echo "=== 构建 Windows exe (Wine + Windows Python) ==="
            bash build/win-build/build-cnb.sh
            echo "=== 构建产物 ==="
            ls -la ./*.zip 2>/dev/null || true

        - name: fetch-one-dragon-oops-exe
          image: alpine:latest
          script: |
            set -e
            apk add --no-cache curl
            TAG="$CNB_BRANCH"
            URL="https://github.com/idk500/OOPS/releases/download/${TAG}/OneDragon-Oops.exe"
            echo "从 GitHub release ${TAG} 抓取 OneDragon-Oops.exe"
            ok=0
            for i in 1 2 3 4 5 6 7 8; do
              if curl -fL --retry 3 --retry-delay 10 -o OneDragon-Oops.exe "$URL"; then ok=1; break; fi
              echo "第 ${i} 次失败,20 秒后重试"; sleep 20
            done
            if [ "$ok" != "1" ] || ! test -s OneDragon-Oops.exe; then
              echo "下载 OneDragon-Oops.exe 失败(GitHub release ${TAG})"; exit 1
            fi
            ls -la OneDragon-Oops.exe

        - name: create-cnb-release
          type: git:release
          options:
            tag: $CNB_BRANCH
            description: |
              ## OOPS $CNB_BRANCH (CNB 原生构建)

              ### 📦 下载

              下载 `oops-windows-x64_*.zip`，解压后双击运行 `oops-windows-x64.exe`

              ### 🚀 使用方法

              1. 解压 zip 到项目路径下(如 `D:/ZZZ-1D`)
              2. 双击运行 `oops-windows-x64.exe`
              3. 自动检测所有可用项目并生成报告
              4. 查看自动打开的 HTML 报告

              **注意**: configs 文件夹包含了预配置的游戏检测规则，请保持在同一目录下

              ---

              ### 📚 文档

              - [快速开始](https://cnb.cool/zzz1d/oops/-/blob/main/QUICKSTART.md)
              - [用户指南](https://cnb.cool/zzz1d/oops/-/blob/main/USER_GUIDE.md)
              - [完整更新日志](https://cnb.cool/zzz1d/oops/-/blob/main/CHANGELOG.md)

        - name: upload-to-cnb-release
          image: cnbcool/attachments:latest
          settings:
            tag: $CNB_BRANCH
            attachments:
              - "./oops-windows-x64_*.zip"
              - "./OneDragon-Oops.exe"
