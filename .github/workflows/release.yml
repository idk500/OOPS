name: Build and Release

on:
  push:
    tags:
      - 'v*'  # 触发条件：推送版本标签，如 v0.1, v1.0.0
  workflow_dispatch:  # 允许手动触发

permissions:
  contents: write  # 允许创建 Release 和上传文件

jobs:
  build:
    name: Build Windows Executable
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller
    
    - name: Build with PyInstaller
      run: |
        pyinstaller --onefile --name oops --icon oops.ico --collect-all tkinter oops.py
    
    - name: Extract version from tag
      id: get_version
      run: |
        $version = "${{ github.ref_name }}"
        echo "version=$version" >> $env:GITHUB_OUTPUT
        echo "Version: $version"
    
    - name: Prepare release package
      run: |
        mkdir release-package
        mv dist/oops.exe release-package/oops-windows-x64.exe
        cp -r configs release-package/
        cp README.md release-package/
        cp QUICKSTART.md release-package/
        cp CHANGELOG.md release-package/
    
    - name: Create ZIP archive with version
      run: |
        $version = "${{ steps.get_version.outputs.version }}"
        $zipName = "oops-windows-x64_$version.zip"
        Compress-Archive -Path release-package/* -DestinationPath $zipName
        echo "ZIP_NAME=$zipName" >> $env:GITHUB_ENV
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: oops-windows
        path: ${{ env.ZIP_NAME }}
        retention-days: 7

  release:
    name: Create Release
    needs: build
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Download artifact
      uses: actions/download-artifact@v4
      with:
        name: oops-windows
        path: .
    
    - name: Display structure
      run: dir
    
    - name: Extract version from tag
      id: get_version
      run: |
        $version = "${{ github.ref_name }}" -replace '^v', ''
        echo "version=$version" >> $env:GITHUB_OUTPUT
        echo "Version: $version"
    
    - name: Extract changelog for this version
      id: changelog
      run: |
        $version = "${{ steps.get_version.outputs.version }}"
        $content = Get-Content CHANGELOG.md -Raw -Encoding UTF8
        
        # 提取当前版本的更新内容
        $pattern = "(?s)## v$version.*?(?=\n## v|\z)"
        if ($content -match $pattern) {
          $versionChangelog = $matches[0]
          # 移除版本标题行
          $versionChangelog = $versionChangelog -replace "^## v$version[^\n]*\n", ""
          $versionChangelog = $versionChangelog.Trim()
          
          # 保存到文件
          $versionChangelog | Out-File -FilePath version-changelog.md -Encoding utf8
          echo "✅ Found changelog for version $version"
        } else {
          echo "⚠️ No changelog found for version $version, using default"
          @"
        ### 更新内容
        
        请查看 [完整更新日志](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md)
        "@ | Out-File -FilePath version-changelog.md -Encoding utf8
        }
    
    - name: Create release notes file
      run: |
        @"
        ## OOPS - One-click Operating Pre-check System

        让游戏脚本运行更顺畅 | Run Your Game Scripts Smoothly

        ### 📦 下载

        下载 ``oops-windows-x64.zip``，解压后双击运行 ``oops-windows-x64.exe``

        ### 🚀 使用方法

        1. 解压 ``oops-windows-x64.zip``到 你想要的项目路径下, 例如 ``D:/ZZZ-1D``
        2. 双击运行 ``oops-windows-x64.exe``
        3. 自动检测所有可用项目并生成报告
        4. 查看自动打开的HTML报告

        **注意**: configs 文件夹包含了预配置的游戏检测规则，请保持在同一目录下

        ---

        "@ | Out-File -FilePath release-notes.md -Encoding utf8
        
        # 追加版本更新内容
        Get-Content version-changelog.md -Raw -Encoding UTF8 | Add-Content -Path release-notes.md -Encoding utf8
        
        # 追加文档链接
        @"

        ---

        ### 📚 文档

        - [快速开始](https://github.com/${{ github.repository }}/blob/main/QUICKSTART.md)
        - [用户指南](https://github.com/${{ github.repository }}/blob/main/USER_GUIDE.md)
        - [完整更新日志](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md)
        "@ | Add-Content -Path release-notes.md -Encoding utf8
        
        echo "=== Release Notes Preview ==="
        Get-Content release-notes.md -Encoding UTF8
        echo "==========================="
    
    - name: Get ZIP filename
      run: |
        $zipFile = Get-ChildItem -Filter "oops-windows-x64_*.zip" | Select-Object -First 1 -ExpandProperty Name
        echo "ZIP_FILE=$zipFile" >> $env:GITHUB_ENV
        echo "Found ZIP file: $zipFile"
    
    - name: Create Release with GitHub CLI
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release create ${{ github.ref_name }} `
          ${{ env.ZIP_FILE }} `
          --title "OOPS ${{ github.ref_name }}" `
          --notes-file release-notes.md `
          --verify-tag
