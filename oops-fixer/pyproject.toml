[project]
name = "oops-fixer"
version = "0.1.0"
description = "OneDragon-Oops 兜底修复器"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pygit2==1.19.3",
    "psutil==7.2.2",
    "certifi",
]

[dependency-groups]
dev = [
    "pyinstaller==6.7.0",
    "ruff>=0.15.18",
]

[tool.uv]
package = false
cache-dir = "./.uv_cache"
environments = ["sys_platform == 'win32'"]
default-groups = []

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "SIM"]
